#
# DataLoader 集群配置
# 基于Akka Cluster的高可用配置
#

akka {
  actor {
    provider = "akka.cluster.ClusterActorRefProvider"
    
    # 序列化配置
    serializers {
      java = "akka.serialization.JavaSerializer"
      proto = "akka.remote.serialization.ProtobufSerializer"
    }
    
    serialization-bindings {
      "java.io.Serializable" = java
      "com.google.protobuf.Message" = proto
    }
    
    # Actor配置
    default-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      
      thread-pool-executor {
        fixed-pool-size = 16
      }
      
      throughput = 1
    }
  }
  
  remote {
    artery {
      canonical.hostname = "127.0.0.1"
      canonical.port = 0
      
      # 传输配置
      transport = tcp
      
      # 高级配置
      advanced {
        # 最大帧大小
        maximum-frame-size = 1 MiB
        
        # 缓冲区大小
        buffer-pool-size = 128
        
        # 连接超时
        handshake-timeout = 15s
        
        # 压缩配置
        compression {
          actor-refs {
            max = 256
          }
          manifests {
            max = 256
          }
        }
      }
    }
    
    # 安全配置
    use-unsafe-remote-features-outside-cluster = off
    
    # 监控配置
    log-remote-lifecycle-events = on
  }
  
  cluster {
    # 种子节点配置
    seed-nodes = [
      "akka://DataLoaderCluster@127.0.0.1:2551",
      "akka://DataLoaderCluster@127.0.0.1:2552"
    ]
    
    # 自动降级配置
    auto-down-unreachable-after = 30s
    
    # 集群角色
    roles = ["master", "worker"]
    
    # 最小成员数
    min-nr-of-members = 2
    
    # 角色配置
    role {
      master.min-nr-of-members = 1
      worker.min-nr-of-members = 1
    }
    
    # 故障检测器配置
    failure-detector {
      implementation-class = "akka.remote.PhiAccrualFailureDetector"
      heartbeat-interval = 1 s
      threshold = 10.0
      max-sample-size = 1000
      min-std-deviation = 100 ms
      acceptable-heartbeat-pause = 3 s
      monitored-by-nr-of-members = 5
      expected-response-after = 5 s
    }
    
    # 集群分片配置
    sharding {
      number-of-shards = 100
      guardian-name = sharding
      role = "master"
      
      # 分片再平衡
      rebalance-interval = 10 s
      max-simultaneous-rebalance = 3
      
      # 分片超时
      shard-region-query-timeout = 3 s
      shard-start-timeout = 10 s
      shard-failure-backoff = 10 s
      entity-restart-backoff = 10 s
      
      # 分片持久化
      state-store-mode = "persistence"
      
      # 记住实体
      remember-entities = on
      
      # 快照配置
      snapshot-after = 1000
      keep-nr-of-batches = 2
      
      # 分片协调器单例
      coordinator-singleton = ${akka.cluster.singleton}
    }
    
    # 单例配置
    singleton {
      singleton-name = "singleton"
      role = "master"
      hand-over-retry-interval = 1s
      min-number-of-hand-over-retries = 15
    }
    
    # 分裂脑解决器配置
    split-brain-resolver {
      active-strategy = keep-majority
      
      # 保持多数策略
      keep-majority {
        role = "master"
      }
      
      # 静态仲裁策略
      static-quorum {
        quorum-size = 2
        role = "master"
      }
      
      # Keep oldest策略
      keep-oldest {
        down-if-alone = true
        role = "master"
      }
      
      # 稳定期
      stable-after = 20s
      
      # 降级配置
      down-all-when-unstable = on
    }
    
    # 集群监控
    jmx.multi-mbeans-in-same-jvm = on
    
    # 集群订阅配置
    pub-sub {
      name = distributedPubSubMediator
      role = ""
      routing-logic = random
      gossip-interval = 1s
      removed-time-to-live = 120s
      max-delta-elements = 3000
      use-dispatcher = ""
    }
    
    # 集群指标
    metrics {
      enabled = on
      native-library-extract-folder = ${user.dir}/target/native
      
      # 收集器配置
      collector {
        enabled = on
        provider = "akka.cluster.metrics.SigarMetricsCollector"
        fallback = true
        sample-interval = 3s
        gossip-interval = 3s
        moving-average-half-life = 12s
      }
    }
  }
  
  # 持久化配置
  persistence {
    journal {
      plugin = "akka.persistence.journal.leveldb"
      
      leveldb {
        dir = "target/journal"
        native = on
        fsync = on
        checksum = off
        class = "akka.persistence.journal.leveldb.LeveldbJournal"
      }
    }
    
    snapshot-store {
      plugin = "akka.persistence.snapshot-store.local"
      
      local {
        dir = "target/snapshots"
        class = "akka.persistence.snapshot.local.LocalSnapshotStore"
      }
    }
    
    # 事件sourcing配置
    at-least-once-delivery {
      redeliver-interval = 5s
      redelivery-burst-limit = 10000
      warn-after-number-of-unconfirmed-attempts = 5
      max-unconfirmed-messages = 100000
    }
  }
  
  # 日志配置
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  loglevel = "INFO"
  stdout-loglevel = "INFO"
  log-dead-letters = 10
  log-dead-letters-during-shutdown = on
  
  # 集群专用日志
  cluster {
    log-info = on
    log-info-verbose = off
  }
  
  # 扩展配置
  extensions = [
    "akka.cluster.metrics.ClusterMetricsExtension",
    "akka.cluster.pubsub.DistributedPubSub"
  ]
}

# DataLoader应用配置
dataloader {
  cluster {
    # 节点配置
    node {
      # 节点ID（自动生成或手动指定）
      id = "auto"
      
      # 节点角色
      roles = ["master", "worker"]
      
      # Master配置
      master {
        enabled = true
        capacity = 1000
        heartbeat-interval = 10s
        heartbeat-timeout = 30s
        
        # 任务调度配置
        task-scheduler {
          queue-size = 10000
          processing-interval = 5s
          retry-attempts = 3
          retry-delay = 30s
        }
        
        # 选举配置
        election {
          timeout-min = 5s
          timeout-max = 10s
          heartbeat-interval = 2s
        }
      }
      
      # Worker配置
      worker {
        enabled = true
        capacity = 10
        heartbeat-interval = 10s
        connection-retry-attempts = 5
        connection-retry-delay = 5s
        
        # 任务执行配置
        task-execution {
          timeout = 300s
          max-retries = 2
          retry-delay = 10s
        }
      }
    }
    
    # 网络配置
    network {
      hostname = "127.0.0.1"
      port = 0
      
      # 种子节点
      seed-nodes = [
        { hostname = "127.0.0.1", port = 2551 },
        { hostname = "127.0.0.1", port = 2552 }
      ]
    }
    
    # 监控配置
    monitoring {
      enabled = true
      metrics-interval = 30s
      health-check-interval = 10s
      
      # JMX配置
      jmx {
        enabled = true
        port = 9999
      }
      
      # Prometheus配置
      prometheus {
        enabled = false
        port = 9090
        path = "/metrics"
      }
    }
    
    # 安全配置
    security {
      enabled = false
      
      # TLS配置
      tls {
        enabled = false
        keystore-path = "cluster.jks"
        keystore-password = "changeit"
        truststore-path = "cluster-trust.jks"
        truststore-password = "changeit"
      }
      
      # 认证配置
      authentication {
        enabled = false
        method = "token"
        token-secret = "change-this-secret"
        token-expiry = "1h"
      }
    }
  }
  
  # 事件存储配置
  event-store {
    type = "optimized-memory"
    
    # 内存存储配置
    memory {
      max-events = 100000
      max-memory-mb = 512
      max-event-size-kb = 1024
      cleanup-threshold = 0.8
    }
    
    # 持久化存储配置
    persistent {
      provider = "postgresql"
      connection-string = "jdbc:postgresql://localhost:5432/dataloader"
      username = "dataloader"
      password = "password"
      
      # 连接池配置
      connection-pool {
        initial-size = 5
        max-size = 20
        timeout = 30s
      }
    }
  }
}

# Kamon监控配置（可选）
kamon {
  metric {
    filters {
      akka-actor {
        includes = ["*/user/*"]
        excludes = ["*/system/*"]
      }
      
      akka-dispatcher {
        includes = ["*/dispatcher/*"]
      }
    }
  }
  
  system-metrics {
    host.enabled = true
    jvm.enabled = true
  }
  
  prometheus {
    start-embedded-http-server = false
  }
}
